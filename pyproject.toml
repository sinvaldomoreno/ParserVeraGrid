[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pwf2raw"
version = "1.0.1"
description = "Conversor de arquivos ANAREDE (.pwf) para PSS/E RAW, para uso no VeraGrid/GridCal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sinvaldo" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
validate = ["VeraGridEngine", "numpy"]

[project.scripts]
pwf2raw = "pwf2raw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
